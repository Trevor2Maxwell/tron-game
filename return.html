<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Complete - TRON Game</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #00ffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        .status {
            font-size: 1.5rem;
            margin: 2rem 0;
        }
        
        .success {
            color: #00ff00;
        }
        
        .processing {
            color: #ffff00;
        }
        
        .error {
            color: #ff6666;
        }
        
        .btn {
            background: rgba(0, 200, 255, 0.2);
            border: 2px solid #00c8ff;
            color: #00ffff;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            margin: 1rem;
            transition: all 0.3s;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TRON Game - Payment Status</h1>
        <div id="status" class="status processing">Processing payment...</div>
        <div id="details"></div>
        <a href="/" class="btn" id="returnBtn" style="display: none;">Return to Game</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('session_id');
        
        if (!sessionId) {
            document.getElementById('status').className = 'status error';
            document.getElementById('status').textContent = 'Error: No session ID found';
        } else {
            // Check session status
            fetch(`/session-status?session_id=${sessionId}`)
                .then(response => response.json())
                .then(data => {
                    const statusEl = document.getElementById('status');
                    const detailsEl = document.getElementById('details');
                    const returnBtn = document.getElementById('returnBtn');
                    
                    if (data.status === 'complete') {
                        statusEl.className = 'status success';
                        statusEl.textContent = 'Payment Successful! 🎮';
                        detailsEl.innerHTML = `<p>Thank you for your purchase! You now have lifetime access to TRON Light Cycles.</p><p>Email: ${data.customer_email}</p>`;
                        returnBtn.style.display = 'inline-block';
                        
                        // Redirect after 3 seconds
                        setTimeout(() => {
                            window.location.href = '/?auth=success&paid=true';
                        }, 3000);
                    } else if (data.status === 'open') {
                        statusEl.className = 'status processing';
                        statusEl.textContent = 'Payment is being processed...';
                        detailsEl.innerHTML = `<p>Your payment is being processed. This may take a few moments.</p>`;
                        
                        // Check again in 2 seconds
                        setTimeout(checkStatus, 2000);
                    } else {
                        statusEl.className = 'status error';
                        statusEl.textContent = 'Payment Failed';
                        detailsEl.innerHTML = `<p>There was an issue with your payment. Please try again.</p>`;
                        returnBtn.style.display = 'inline-block';
                    }
                })
                .catch(error => {
                    document.getElementById('status').className = 'status error';
                    document.getElementById('status').textContent = 'Error checking payment status';
                    document.getElementById('details').innerHTML = `<p>Please contact support if this issue persists.</p>`;
                });
        }
        
        function checkStatus() {
            fetch(`/session-status?session_id=${sessionId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'complete') {
                        window.location.href = '/?auth=success&paid=true';
                    } else {
                        setTimeout(checkStatus, 2000);
                    }
                })
                .catch(() => {
                    setTimeout(checkStatus, 2000);
                });
        }
    </script>
</body>
</html>
