# fly.toml app configuration file generated for tron-game-zoom on 2026-03-11T17:11:49-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tron-game-zoom'
primary_region = 'ord'

[build]

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[env]
  ZOOM_CLIENT_ID = "euKufztBTsKkHTpaDoFFNQ"
